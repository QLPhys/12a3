      '<span class="what"><b>' + esc(lab(a)) + '</b><small>' + esc(e.n) + (e.note ? ' · ' + esc(e.note) : '') + (e.by && e.by !== WHO ? ' · ' + esc(e.by) : '') + '</small>' + extra + '</span>';
    var right = document.createElement('div');
    right.innerHTML = '<div class="val ' + c + ' num">' + sign(e.p || e.v) + '</div>';
    if (e.by === WHO && !e.ok && !locked()) {
      var d = document.createElement('button');
      d.type = 'button'; d.className = 'del' + (state.delArm === e.row ? ' arm' : '');
      d.textContent = state.delArm === e.row ? 'Chạm để xóa' : 'Xóa';
      d.onclick = function () {
        if (state.busy) return;
        if (state.delArm !== e.row) { state.delArm = e.row; renderLog(); setTimeout(function () { if (state.delArm === e.row) { state.delArm = null; renderLog(); } }, 3000); return; }
        state.delArm = null;
        xoa([e.row], 'Đã xóa: ' + lab(a) + ' · ' + given(e.n));
      };
      right.appendChild(d);
    }
    r.appendChild(right);
    return r;
  }
  function renderLog() {
    var w = state.week;
    $('logDay').textContent = state.date === TODAY ? 'Hôm nay' : wd(state.date) + ' ' + fmt(state.date);
    $('logDay').setAttribute('aria-pressed', String(!state.logAll));
    $('logWeek').setAttribute('aria-pressed', String(state.logAll));
    $('logTitle').textContent = state.logAll ? 'Ghi nhận tuần ' + w : 'Đã ghi ' + (state.date === TODAY ? 'hôm nay' : 'ngày ' + fmt(state.date));
    var items = state.entries.filter(function (e) { var d = dn(e.d); return state.logAll ? weekOf(d) === w : d === state.date; })
      .sort(function (a, b) { return dn(b.d) - dn(a.d) || b.row - a.row; });
    var box = $('log');
    box.innerHTML = '';
    if (!items.length) {
      box.innerHTML = '<div class="empty">' + (locked() ? 'Không có ghi nhận nào.' : 'Chưa có ghi nhận nào. Chạm vào tên bạn ở trên để bắt đầu.') + '</div>';
      return;
    }
    var lastD = null;
    items.forEach(function (e) {
      var d = dn(e.d);
      if (state.logAll && d !== lastD) {
        var h = document.createElement('div');
        h.className = 'dayhead num';
        h.textContent = wd(d) + ' · ' + fmt(d);
        box.appendChild(h);
        lastD = d;
      }
      box.appendChild(rowEl(e));
    });
  }
  var armTimer = null;
  function pick(a) {
    if (state.busy || locked()) return;
    var note = $('note').value.trim();
    if (state.adjust && !note) {
      toast('Tuần đã chốt: hãy ghi lý do điều chỉnh vào ô Ghi chú trước.', false);
      $('note').classList.add('req');
      $('note').focus();
      return;
    }
    if (a.v <= -5 && state.armed !== a.c) {
      state.armed = a.c; renderSheet();
      clearTimeout(armTimer);
      armTimer = setTimeout(function () { state.armed = null; renderSheet(); }, 3000);
      return;
    }
    state.armed = null;
    var names = state.sel.slice();
    var payload = { date: ds(state.date), names: names, code: a.c, sup: a.v < 0 ? state.sup : 0, note: note };
    state.busy = true;
    toast('Đang ghi…', false);
    renderSheet();
    call('ghiNhan', [KEY, payload], function (res) {
      state.busy = false;
      state.entries = res.entries;
      state.lastRows = res.rows;
      state.sel = []; state.sup = 0; state.min = false; $('note').value = '';
      state.pops = {};
      names.forEach(function (n) { state.pops[n] = sign(a.v); });
      setTimeout(function () { state.pops = {}; }, 1400);
      toast('Đã ghi ' + sign(a.v) + ' “' + lab(a) + '” cho ' + names.map(given).join(', '), true);
      render();
    }, function (err) {
      state.busy = false;
      toast('Chưa ghi được: ' + ((err && err.message) || err) + ' Thử lại sau ít phút.', false);
      render();
    });
  }
  function xoa(rows, msg) {
    state.busy = true;
    toast('Đang xóa…', false);
    call('xoaGhiNhan', [KEY, rows], function (res) { state.busy = false; state.entries = res.entries; toast(msg, false); render(); },
      function (err) { state.busy = false; toast('Chưa xóa được: ' + ((err && err.message) || err), false); render(); });
  }
  var tTimer = null;
  function toast(msg, canUndo) {
    $('toastMsg').textContent = msg;
    $('undo').hidden = !canUndo;
    $('toast').classList.toggle('up', state.sel.length > 0);
    $('toast').classList.add('show');
    clearTimeout(tTimer);
    tTimer = setTimeout(function () { $('toast').classList.remove('show'); }, canUndo ? 8000 : 4000);
  }
  $('undo').onclick = function () { if (!state.lastRows || state.busy) return; var rows = state.lastRows; state.lastRows = null; xoa(rows, 'Đã hoàn tác'); };
  $('reload').onclick = function () {
    call('layDuLieu', [KEY], function (d) { state.entries = d.entries; render(); toast('Đã cập nhật điểm mới nhất', false); },
      function () { toast('Chưa tải lại được. Kiểm tra mạng rồi thử lại.', false); });
  };
  $('all').onclick = function () {
    if (locked()) { toast('Tuần ' + state.week + ' đã chốt. Bấm "Điều chỉnh" nếu có thay đổi hoặc phát sinh.', false); return; }
    state.sel = STUDENTS.slice(); state.min = false; render();
  };
  $('none').onclick = function () { state.sel = []; render(); };
  $('close').onclick = function () { state.sel = []; state.armed = null; state.min = false; render(); };
  $('toggleMin').onclick = function () { state.min = !state.min; renderSheet(); };
  $('logDay').onclick = function () { if (!state.logAll) return; state.logAll = false; renderLog(); stagger('log'); };
  $('logWeek').onclick = function () { if (state.logAll) return; state.logAll = true; renderLog(); stagger('log'); };
  $('note').oninput = function () { $('note').classList.toggle('req', state.adjust && !$('note').value.trim()); };
  $('supPlus').onclick = function () { state.sup = Math.min(10, state.sup + 1); renderSheet(); };
  $('supMinus').onclick = function () { state.sup = Math.max(0, state.sup - 1); renderSheet(); };
  function render(scroll) { renderHeader(scroll); renderLock(); renderSummary(); renderGrid(); renderSheet(); renderLog(); }
  var THEMES = ['auto', 'light', 'dark'], TLAB = { auto: 'Tự động theo máy', light: 'Sáng', dark: 'Tối' };
  var theme = 'auto';
  try { theme = localStorage.getItem('sotd-theme') || 'auto'; } catch (e) {}
  if (THEMES.indexOf(theme) < 0) theme = 'auto';
  function applyTheme(t) {
    var r = document.documentElement;
    if (t === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', t);
    var b = $('theme');
    b.innerHTML = svg(t === 'auto' ? 'auto' : t === 'light' ? 'sun' : 'moon');
    b.setAttribute('aria-label', 'Giao diện: ' + TLAB[t] + '. Chạm để đổi');
    b.title = 'Giao diện: ' + TLAB[t];
  }
  applyTheme(theme);
  $('theme').onclick = function () {
    theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
    try { localStorage.setItem('sotd-theme', theme); } catch (e) {}
    applyTheme(theme);
    restart($('theme'), 'spin');
    toast('Giao diện: ' + TLAB[theme], false);
  };
  var sx = null, sy = 0, st0 = 0;
  document.addEventListener('touchstart', function (e) {
    var t = e.target;
    if (state.sel.length || e.touches.length > 1 || (t.closest && t.closest('.strip, .sheet, .toast, input'))) { sx = null; return; }
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; st0 = Date.now();
  }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (sx === null) return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    sx = null;
    if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.8 || Date.now() - st0 > 700) return;
    stepWeek(dx < 0 ? 1 : -1);
  }, { passive: true });
  var gz = $('grabZone'), gy = null, gd = 0;
  gz.addEventListener('touchstart', function (e) { gy = e.touches[0].clientY; gd = 0; $('sheet').classList.add('dragging'); }, { passive: true });
  gz.addEventListener('touchmove', function (e) {
    if (gy === null) return;
    gd = Math.max(0, e.touches[0].clientY - gy);
    $('sheet').style.transform = 'translateY(' + gd + 'px)';
  }, { passive: true });
  function endDrag() {
    if (gy === null) return;
    gy = null;
    var sh = $('sheet');
    sh.classList.remove('dragging');
    sh.style.transform = '';
    if (gd > 70) {
      if (!state.min) { state.min = true; renderSheet(); }
      else { state.sel = []; state.armed = null; state.min = false; render(); }
    }
  }
  gz.addEventListener('touchend', endDrag);
  gz.addEventListener('touchcancel', endDrag);
  gz.onclick = function () { if (gd > 5) return; state.min = !state.min; renderSheet(); };
  render(true);
  stagger('grid'); stagger('log');
})();
}
</script>
