<style>

:root[data-theme="dark"] {
  --bg: #0a0f1e; --card: #141b2f; --card-2: #1a2238; --ink: #edf1fb; --ink-2: #c6cde0; --muted: #98a2bd; --line: #26304a;
  --brand: #3f6bff; --brand-2: #142a73; --sun: #ffd45e;
  --tot: #34d399; --kha: #60a5fa; --dat: #fbbf24; --cd: #ff5a6e;

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); transition: background-color .3s ease, color .3s ease; }
body { color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }

button { cursor: pointer; }

.num { font-variant-numeric: tabular-nums; }
.app { max-width: 620px; margin: 0 auto; padding: 0 16px 40px; }
.screen[hidden] { display: none; }

.recent { display: flex; align-items: center; gap: 12px; border: 0; width: 100%; text-align: left; background: linear-gradient(120deg, var(--kha-soft), var(--card)); border-radius: 18px; padding: 12px 14px; margin-top: 14px; box-shadow: var(--shadow-s); }

.grp-h { margin: 20px 4px 8px; font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; display: flex; justify-content: space-between; }
.list { display: grid; gap: 8px; }
.person { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; text-align: left; background: var(--card); border-radius: 18px; padding: 10px 12px; box-shadow: var(--shadow-s); transition: transform .15s ease, background-color .3s ease; }
.person:active { transform: scale(.98); }
.av { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 900; font-size: 17px; flex-shrink: 0; }
.person .nm { flex: 1; min-width: 0; }

.person svg.chev { width: 18px; height: 18px; color: var(--muted); }
.empty { text-align: center; color: var(--muted); background: var(--card); border-radius: 18px; padding: 24px 14px; border: 2px dashed var(--line); font-size: 14px; }
.foot { color: var(--muted); font-size: 12px; text-align: center; margin-top: 24px; }
.bar-top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 -16px; padding: 10px 16px;
  background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(12px); }
.back { border: 0; background: var(--card); border-radius: 999px; padding: 8px 14px 8px 10px; font-weight: 700; font-size: 13px; display: inline-flex; align-items: center; gap: 4px; box-shadow: var(--shadow-s); }

.profile { position: relative; overflow: hidden; border-radius: 26px; padding: 18px; color: #fff; margin-top: 4px;

.profile .deco { position: absolute; inset: 0; pointer-events: none; }
.profile > *:not(.deco) { position: relative; z-index: 1; }
.pf-row { display: flex; align-items: center; gap: 14px; }

.pf-row p { margin: 2px 0 0; opacity: .85; font-size: 13px; }
.pf-main { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; margin-top: 16px; }
.ring { width: 104px; height: 104px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--c, #fff) calc(var(--p, 0) * 3.6deg), rgba(255,255,255,.18) 0); }

.lvl { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: 13px; padding: 4px 10px; border-radius: 999px; color: #fff; }
.lvl.tot { background: var(--tot); } .lvl.kha { background: var(--kha); } .lvl.dat { background: var(--dat); color: #2a1d00; } .lvl.cd { background: var(--cd); } .lvl.na { background: rgba(127,127,127,.3); }
.pf-info b { font-size: 15px; display: block; margin-top: 6px; }
.pf-info small { opacity: .85; font-size: 13px; }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.kpi { background: var(--card); border-radius: 18px; padding: 12px 14px; box-shadow: var(--shadow-s); min-width: 0; }
.kpi small { display: block; color: var(--muted); font-size: 12px; font-weight: 700; }
.kpi b { display: block; font-size: 24px; font-weight: 900; line-height: 1.15; margin: 2px 0; }
.kpi .lvl { font-size: 11px; padding: 2px 8px; }
.kpi .ico { float: right; width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; }
.kpi .ico svg { width: 17px; height: 17px; }
.ico.pos { background: var(--pos-soft); color: var(--pos); } .ico.neg { background: var(--neg-soft); color: var(--neg); } .ico.M { background: var(--neg-soft); color: var(--major); }
.ico.br { background: var(--kha-soft); color: var(--brand); } .ico.gd { background: var(--tot-soft); color: var(--tot); }
.alerts { display: grid; gap: 8px; margin-top: 14px; }
.alert { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px; align-items: start; border-radius: 18px; padding: 12px 14px; }
.alert .ai { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; }
.alert .ai svg { width: 20px; height: 20px; }
.alert b { display: block; font-size: 14px; }
.alert span { font-size: 13px; }
.alert.crit { background: var(--crit-soft); color: var(--crit); } .alert.crit .ai { background: var(--crit); color: #fff; }
.alert.warn { background: var(--warn-soft); color: var(--warn); } .alert.warn .ai { background: var(--warn); color: #241800; }
.alert.good { background: var(--good-soft); color: var(--good); } .alert.good .ai { background: var(--good); color: #fff; }
.alert span { color: var(--ink-2); }
.tabs { position: sticky; top: 58px; z-index: 15; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--card); border-radius: 16px; padding: 4px; margin-top: 18px; box-shadow: var(--shadow-s); }
.tabs button { border: 0; background: transparent; border-radius: 12px; padding: 10px 6px; font-weight: 800; font-size: 14px; color: var(--muted); position: relative; z-index: 1; transition: color .2s ease; }
.tabs button[aria-selected="true"] { color: #fff; }
.tabs .pill-bg { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / 3); border-radius: 12px; background: var(--brand); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
.pane[hidden] { display: none; }
.wk-strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; }
.wk { border-radius: 12px; padding: 6px 2px; text-align: center; background: var(--h0); border: 0; }
.wk small { display: block; font-size: 10px; color: var(--muted); font-weight: 700; }
.wk b { font-size: 15px; font-weight: 900; }
.wk.tot { background: var(--tot-soft); } .wk.kha { background: var(--kha-soft); } .wk.dat { background: var(--dat-soft); } .wk.cd { background: var(--cd-soft); }
.wk.tot b { color: var(--tot); } .wk.kha b { color: var(--kha); } .wk.dat b { color: var(--dat); } .wk.cd b { color: var(--cd); }
.wk.off { background: repeating-linear-gradient(135deg, var(--h0) 0 4px, transparent 4px 8px); }
.wk.cur { box-shadow: 0 0 0 2px var(--brand); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: 12px; color: var(--ink-2); align-items: center; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 5px; vertical-align: -2px; }
.months { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.mo { background: var(--card-2); border-radius: 16px; padding: 10px 12px; border-left: 4px solid var(--line); }
.mo small { display: block; font-size: 12px; color: var(--muted); font-weight: 700; }
.mo b { font-size: 20px; font-weight: 900; }
.mo.tot { border-color: var(--tot); } .mo.kha { border-color: var(--kha); } .mo.dat { border-color: var(--dat); } .mo.cd { border-color: var(--cd); }
.mo em { font-style: normal; font-size: 11px; font-weight: 800; display: block; color: var(--ink-2); }
table.hk { width: 100%; border-collapse: collapse; font-size: 14px; }
table.hk th, table.hk td { padding: 10px 6px; text-align: left; border-bottom: 1px solid var(--line); }
table.hk th { font-size: 12px; color: var(--muted); font-weight: 700; }
table.hk td.n { font-weight: 900; }
.note { font-size: 12px; color: var(--muted); margin-top: 10px; }
.hm-wrap { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 6px; }
.hm-days { display: grid; grid-template-rows: 16px repeat(7, 18px); gap: 3px; font-size: 10px; color: var(--muted); font-weight: 700; }
.hm-days span { line-height: 18px; }
.hm-scroll { overflow-x: auto; scrollbar-width: thin; padding-bottom: 6px; }
.hm { display: grid; grid-template-rows: 16px repeat(7, 18px); grid-auto-flow: column; grid-auto-columns: 18px; gap: 3px; }
.hm .wl { font-size: 10px; color: var(--muted); font-weight: 700; text-align: center; line-height: 16px; }
.cell { width: 18px; height: 18px; border-radius: 5px; background: var(--h0); border: 0; padding: 0; position: relative; }
.cell.fut { background: transparent; }
.cell.off { background: repeating-linear-gradient(135deg, var(--h0) 0 3px, transparent 3px 6px); }
.cell.z { background: var(--hz); }
.cell.b1 { background: var(--hb1); } .cell.b2 { background: var(--hb2); } .cell.b3 { background: var(--hb3); }
.cell.r1 { background: var(--hr1); } .cell.r2 { background: var(--hr2); } .cell.r3 { background: var(--hr3); }
.cell.today { box-shadow: 0 0 0 2px var(--ink); }
.cell.sel { box-shadow: 0 0 0 2px var(--brand), 0 0 0 4px var(--card); }
.hm-detail { margin-top: 10px; background: var(--card-2); border-radius: 14px; padding: 10px 12px; font-size: 13px; min-height: 42px; }
.hm-detail b { font-size: 13px; }
.hm-detail ul { margin: 4px 0 0; padding-left: 18px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 6px 9px; font-size: 12px; font-weight: 600; white-space: nowrap; transform: translate(-50%, -110%); opacity: 0; transition: opacity .12s ease; z-index: 5; }
.tip.show { opacity: 1; }
.lg-line { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--pos); margin-right: 6px; vertical-align: 3px; }
.lg-line.avg { border-top: 2px dashed var(--muted); }
.bars { display: grid; gap: 10px; }
.br { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; font-size: 13px; }
.br .t { font-weight: 700; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.br .v { font-weight: 800; color: var(--ink); }
.br .track { grid-column: 1 / -1; height: 10px; border-radius: 0 5px 5px 0; background: var(--h0); overflow: hidden; }
.br .fill { height: 100%; border-radius: 0 5px 5px 0; transform-origin: left; animation: grow .7s cubic-bezier(.2,.8,.2,1) both; }
.br .fill.pos { background: var(--pos); } .br .fill.neg { background: var(--neg); }
@keyframes grow { from { transform: scaleX(0); } to { transform: none; } }
.two { display: grid; gap: 18px; }
@media (min-width: 560px) { .two { grid-template-columns: 1fr 1fr; } }
.two h4 { margin: 0 0 10px; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.two h4 i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.filters { display: flex; gap: 8px; margin: 14px 0 4px; }
.wkh { display: flex; justify-content: space-between; align-items: baseline; margin: 16px 4px 8px; }
.wkh b { font-size: 14px; }
.wkh span { font-size: 12px; color: var(--muted); font-weight: 600; }
.row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--card); border-radius: 16px; padding: 10px 12px; box-shadow: var(--shadow-s); margin-bottom: 8px; }
.row .ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; }
.row .ico svg { width: 20px; height: 20px; }
.row .what b { display: block; font-size: 14px; font-weight: 700; }
.row .what small { color: var(--muted); font-size: 12px; }
.row .val { font-weight: 900; font-size: 17px; text-align: right; }
.row .val small { display: block; font-size: 11px; color: var(--muted); font-weight: 700; }
.pend { display: block; font-size: 11px; font-weight: 800; color: var(--warn); margin-top: 2px; }
.skel { border-radius: 18px; background: linear-gradient(90deg, var(--card) 0%, var(--card-2) 50%, var(--card) 100%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 40; transform: translate(-50%, calc(100% + 40px)); width: min(92vw, 480px);
  background: var(--ink); color: var(--bg); border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow); font-size: 14px; transition: transform .25s cubic-bezier(.2,.8,.2,1); }
.toast.show { transform: translate(-50%, 0); }
@keyframes inR { from { opacity: 0; transform: translateX(48px); } to { opacity: 1; transform: none; } }
@keyframes inL { from { opacity: 0; transform: translateX(-48px); } to { opacity: 1; transform: none; } }

      cross.setAttribute('x1', X(w)); cross.setAttribute('x2', X(w)); cross.setAttribute('visibility', 'visible');
      tip.innerHTML = 'Tuần ' + w + (isOff(w) ? ': nghỉ Tết' : ': <b>' + (typeof v === 'number' ? v + ' · ' + level(v)[0] : 'chưa có') + '</b> · TB lớp ' + f1(a));
      tip.style.left = Math.max(70, Math.min(r.width - 70, X(w) * r.width / W)) + 'px';
      tip.style.top = (typeof v === 'number' ? Y(v) : T + 20) * r.height / H + 'px';
      tip.classList.add('show');
    }
    function off() { tip.classList.remove('show'); cross.setAttribute('visibility', 'hidden'); }
    hit.addEventListener('mousemove', at); hit.addEventListener('mouseleave', off);
    hit.addEventListener('touchstart', at, { passive: true }); hit.addEventListener('touchmove', at, { passive: true }); hit.addEventListener('touchend', function () { setTimeout(off, 1600); });
  }

   
  function renderLog() {
    var d = cur.data;
    var h = '<div class="filters chips" role="group" aria-label="Lọc nhật ký">' +
      [['all', 'Tất cả'], ['pos', 'Được cộng'], ['neg', 'Bị trừ']].map(function (f) { return '<button type="button" class="chip" data-f="' + f[0] + '" aria-pressed="' + (cur.filter === f[0]) + '">' + f[1] + '</button>'; }).join('') + '</div><div id="logList">';
    var items = d.entries.filter(function (e) { return cur.filter === 'all' || (cur.filter === 'pos' ? e.v > 0 : e.v < 0); })
      .sort(function (a, b) { return dn(b.d) - dn(a.d); });
    if (!items.length) h += '<div class="empty" style="margin-top:12px">Chưa có ghi nhận nào.</div>';
    var lastW = null;
    items.forEach(function (e) {
      var day = dn(e.d), w = weekOf(day);
      if (w !== lastW) {
        lastW = w;
        var sc = d.weeks[w - 1];
        h += '<div class="wkh"><b>Tuần ' + w + '</b><span class="num">' + fmt(monOf(w)) + ' – ' + fmt(monOf(w) + 6) + (typeof sc === 'number' ? ' · ' + sc + ' điểm · ' + level(sc)[0] : '') + '</span></div>';
      }
      var c = e.v > 0 ? 'pos' : e.v <= -5 ? 'M' : 'neg';
      var extra = '';
      if (e.s && !e.ok) extra = '<span class="pend">Đề xuất trừ thêm ' + e.s + ' · chờ GVCN duyệt</span>';
      if (e.s && e.ok) extra = '<span class="pend">GVCN đã duyệt trừ thêm ' + e.s + '</span>';
      h += '<div class="row"><span class="ico ' + c + '">' + svg(CODE_ICON[e.c] || (e.v > 0 ? 'plus' : 'alert')) + '</span>' +
        '<span class="what"><b>' + esc(lab(e.c)) + '</b><small>' + wd(day) + ' ' + fmt(day) + (e.by ? ' · ' + esc(e.by) : '') + (e.note ? ' · ' + esc(e.note) : '') + '</small>' + extra + '</span>' +
        '<span class="val num">' + sign(e.p || e.v) + '<small>điểm</small></span></div>';
    });
    h += '</div>';
    $('pane2').innerHTML = h;
    [].forEach.call($('pane2').querySelectorAll('[data-f]'), function (b) {
      b.onclick = function () { cur.filter = b.getAttribute('data-f'); renderLog(); stagger($('logList')); };
    });
  }

   
  var sx = null, sy = 0, st0 = 0;
  document.addEventListener('touchstart', function (e) {
    var t = e.target;
    if ($('scrView').hidden || e.touches.length > 1 || (t.closest && t.closest('.hm-scroll, .chips, .chart'))) { sx = null; return; }
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; st0 = Date.now();
  }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (sx === null || !cur.data) return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    sx = null;
    if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.8 || Date.now() - st0 > 700) return;
    var n = cur.tab + (dx < 0 ? 1 : -1);
    if (n >= 0 && n <= 2) setTab(n);
  }, { passive: true });
  var rz = null;
  window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(function () { if (cur.data && cur.tab === 1) drawLine(); }, 200); });

  renderHeroStats(); renderChips(); renderRecent(); renderPeople(true);
  if (INIT && STUDENTS.some(function (s) { return s.n === INIT; })) openStudent(INIT);
})();
}
